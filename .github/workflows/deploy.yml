name: Deploy Firebase Backend

on:
  push:
    branches: [main]

jobs:
  deploy-functions-and-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci
        working-directory: functions

      - uses: w9jds/firebase-action@v15.22.3
        with:
          args: deploy --only functions,firestore:rules,storage
        env:
          GCP_SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SARQYT_1AB95 }}
