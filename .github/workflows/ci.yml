name: "CI"

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

jobs:
    analyze-and-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: subosito/flutter-action@v2
              with:
                  channel: stable
                  cache: true

            - run: flutter pub get

            - name: Create .env for envied codegen
              run: echo 'STADIA_MAPS_API_KEY=${{ secrets.STADIA_MAPS_API_KEY }}' > .env

            - run: dart run build_runner build --delete-conflicting-outputs

            - run: flutter analyze --no-fatal-warnings

            - run: flutter test --exclude-tags golden

    functions-lint:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: functions
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: functions/package-lock.json

             # Эмулятор Firestore — Java-процесс.
            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: "17"

            - run: npm ci
            - run: npm run lint
            - run: npm run build

            # Пин: без него новый мажор firebase-tools положит CI на
            # постороннем PR.
            - name: Install Firebase CLI
              run: npm install -g firebase-tools@^15

            # deploy.yml отправляет firestore.rules в прод при каждом мёрдже
            # в main, поэтому набор правил обязан этот мёрдж гейтить.
            # working-directory: . обязателен — у джобы дефолт functions,
            # а emulators:exec читает корневой firebase.json.
            - name: Rules and function tests (emulator)
              working-directory: .
              run: firebase emulators:exec --only firestore,auth "cd functions && npm test"
