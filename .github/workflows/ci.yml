name: "CI"

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

jobs:
    analyze-and-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: subosito/flutter-action@v2
              with:
                  channel: stable
                  cache: true

            - run: flutter pub get

            - name: Create dummy .env for envied codegen
              run: echo 'STADIA_MAPS_API_KEY=ci-placeholder' > .env

            - run: dart run build_runner build --delete-conflicting-outputs

            - run: flutter analyze

            - run: flutter test

    functions-lint:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: functions
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: functions/package-lock.json

            - run: npm ci
            - run: npm run lint
            - run: npm run build
